<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>اهربي أيتها العروس</title>
<style>
  :root{--bg:#2b1630;--ink:#fff3f6;--accent:#ff7aa8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#4a2150,#1d0e22);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  canvas{display:block;border-radius:18px;box-shadow:0 12px 50px rgba(0,0,0,.55),0 0 0 3px rgba(255,170,200,.35);touch-action:none;cursor:pointer}
  #bar{display:flex;gap:14px;align-items:center;font-size:13px;opacity:.85;flex-wrap:wrap;justify-content:center;padding:0 10px}
  button{font:inherit;color:var(--ink);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 14px;cursor:pointer}
  button:hover{background:rgba(255,255,255,.22)}
  #rot{display:none;background:#ffd166;color:#4a2150;font-weight:bold;padding:8px 16px;border-radius:12px;font-size:14px;text-align:center;margin:0 12px}
  @media (orientation:portrait) and (max-width:700px){#rot{display:block}}
</style>
</head>
<body>
<div id="rot">📱↻ أدِيري الهاتف أفقياً لتجربة أفضل</div>
<canvas id="c"></canvas>
<div id="bar">
  <span>مسافة / ↑ : قفز (اضغطي مطولاً لقفزة أعلى)</span>
  <span>↓ : انحناء</span>
  <span>موبايل: المسي الأعلى للقفز والأسفل للانحناء</span>
  <button id="mute">الصوت: تشغيل</button>
  <button id="share" hidden style="background:#ff7aa8;border-color:#ff7aa8;font-weight:bold">شاركي نتيجتك على انستغرام</button>
</div>
<script>
(()=>{
'use strict';
/* ============ إعدادات عامة ============ */
const LW=960,LH=360,GY=300,BX=480;           // عرض/ارتفاع منطقي، خط الأرض، موضع العروس (المنتصف)
const GRAV=2700,JUMPV=-930;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1;
function fit(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  let w=Math.min(innerWidth-16,1180),h=w*LH/LW;
  const maxH=innerHeight-70;
  if(h>maxH){h=Math.max(maxH,120);w=h*LW/LH;}
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  scale=cv.width/LW;
}
addEventListener('resize',fit);fit();

/* ============ أدوات ============ */
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return `rgb(${lerp(A[0],B[0],t)|0},${lerp(A[1],B[1],t)|0},${lerp(A[2],B[2],t)|0})`;};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function heart(c,x,y,s,col){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle=col;c.beginPath();c.moveTo(0,4);c.bezierCurveTo(-10,-4,-6,-12,0,-6);c.bezierCurveTo(6,-12,10,-4,0,4);c.fill();c.restore();}
function line(c,x1,y1,x2,y2,w,col){c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function ell(c,x,y,rx,ry,col,rot){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,6.2832);c.fill();}

/* ============ المراحل ============ */
const STAGE_LEN=600;
const STAGES=[
  {name:'حديقة الورد',top:'#ffd7e8',bot:'#fff1d9',sun:'#ffcf8a',hill1:'#f3b0c8',hill2:'#e590b0',lights:0,night:0,grass:'#9fe2a6',path:'#f6e3d0',deco:'arch'},
  {name:'شاطئ الغروب',top:'#ff9a8b',bot:'#ffd29a',sun:'#fff2b0',hill1:'#d77aa3',hill2:'#b95b8a',lights:.5,night:0,grass:'#ecd9a6',path:'#f0d3c0',deco:'beach'},
  {name:'بستان الزيتون',top:'#cfe9ff',bot:'#fff6dc',sun:'#fff1a8',hill1:'#9cc7a0',hill2:'#6fa87d',lights:0,night:0,grass:'#8fcf7a',path:'#ead8bf',deco:'olive'},
  {name:'وادي رم',top:'#ffb88a',bot:'#ffe2b8',sun:'#fff0c0',hill1:'#d98c6a',hill2:'#b86a4c',lights:.2,night:0,grass:'#e0b27a',path:'#e9c9a4',deco:'rum'},
  {name:'ليلة القلعة',top:'#2b2160',bot:'#8a4f9c',sun:'#fff6d8',hill1:'#5b3a78',hill2:'#41285c',lights:1,night:1,grass:'#4f8f78',path:'#c9a9b8',deco:'castle'},
  {name:'قاعة الذهب',top:'#1f1535',bot:'#6b3a6f',sun:'#ffe9a8',hill1:'#4a2f5f',hill2:'#36204c',lights:1,night:1,grass:'#7a6a3c',path:'#d8b97a',deco:'hall'}
];

/* ============ الصوت (بدون ملفات خارجية) ============ */
let AC=null,master=null,muted=false,musicOn=false,nextT=0,mstep=0,sched=null;
try{muted=localStorage.getItem('bride_muted')==='1';}catch(e){}
const muteBtn=document.getElementById('mute');
function syncMute(){muteBtn.textContent='الصوت: '+(muted?'إيقاف':'تشغيل');if(master)master.gain.value=muted?0:.9;}
muteBtn.addEventListener('click',e=>{e.stopPropagation();muted=!muted;try{localStorage.setItem('bride_muted',muted?'1':'0');}catch(_){}syncMute();});
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);syncMute();}catch(e){AC=null;}
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t0,d,type,v,to){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);
  g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+.03);
}
function noise(t0,d,v){
  if(!AC)return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(master);s.start(t0);
}
const sfx={
  jump(){if(!AC)return;const t=AC.currentTime;tone(360,t,.17,'square',.06,820);},
  land(){if(!AC)return;const t=AC.currentTime;noise(t,.06,.05);},
  hit(){if(!AC)return;const t=AC.currentTime;noise(t,.25,.18);tone(220,t,.3,'sawtooth',.1,60);},
  flash(){if(!AC)return;const t=AC.currentTime;tone(2400,t,.07,'sine',.04,1200);},
  mile(){if(!AC)return;const t=AC.currentTime;[72,76,79,84].forEach((m,i)=>tone(mtof(m),t+i*.08,.2,'triangle',.09));},
  caught(){if(!AC)return;const t=AC.currentTime;[67,64,60,55].forEach((m,i)=>tone(mtof(m),t+i*.18,.3,'triangle',.12));},
  trip(){if(!AC)return;const t=AC.currentTime;tone(500,t,.25,'sine',.07,150);}
};
const MEL=[72,0,76,0,79,0,76,0, 77,0,81,0,77,0,74,0, 79,0,83,0,79,0,74,0, 76,0,72,0,67,0,72,0];
const ROOT=[48,53,55,48],CH=[[0,4,7],[0,4,9],[0,4,7],[0,4,7]];
function musicTick(){
  if(!AC||!musicOn)return;
  const e=60/150/2;
  while(nextT<AC.currentTime+.18){
    const s=mstep%32,bar=s>>3,beat=s&7;
    if(nextT<AC.currentTime)nextT=AC.currentTime+.02;
    if(beat%4===0)tone(mtof(ROOT[bar]-12),nextT,e*3.2,'triangle',.13);
    tone(mtof(ROOT[bar]+12+CH[bar][beat%3]),nextT,e*.9,'sine',.035);
    if(MEL[s])tone(mtof(MEL[s]),nextT,e*1.6,'triangle',.07);
    nextT+=e;mstep++;
  }
}
function startMusic(){if(!AC)return;musicOn=true;nextT=AC.currentTime+.05;mstep=0;if(!sched)sched=setInterval(musicTick,40);}
function stopMusic(){musicOn=false;}

/* ============ الحالة ============ */
let best=0;try{best=+(localStorage.getItem('bride_best_v2')||0);}catch(e){}
const OBS_DEFS=[];       // تُعرّف لاحقاً
let st,last=0;
function reset(state){
  st={
    state:state||'ready',t:0,dist:0,speed:380,gap:250,
    bride:{y:GY,vy:0,air:false,duck:false,hold:false,stun:0,inv:0,ph:0},
    groom:{y:GY,vy:0,air:false,stun:0,ph:0,say:'',sayT:0,nextSay:3},
    obs:[],nextAt:700,
    parts:[],shake:0,flash:0,
    msg:'',msgT:0,miles:0,overT:0,
    stage:0,banner:2.6,bannerText:'المرحلة 1: '+STAGES[0].name
  };
}
reset('ready');
const score=()=>Math.floor(st.dist/12);
function say(m,t){st.msg=m;st.msgT=t||1.6;}

/* ============ الإدخال ============ */
function press(duckHint){
  initAudio();
  if(st.state==='ready'){const keep=st.t;reset('run');st.t=keep;startMusic();}
  else if(st.state==='over'){if(st.overT<.8)return;reset('run');startMusic();}
  const b=st.bride;
  if(duckHint){b.duck=true;return;}
  if(!b.air){b.vy=JUMPV;b.air=true;sfx.jump();burst(BX,GY,6,'dust');}
  b.hold=true;
}
function releaseAll(){st.bride.hold=false;st.bride.duck=false;}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)press(false);}
  else if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();if(st.state==='run')st.bride.duck=true;else if(!e.repeat)press(false);}
  else if(e.code==='KeyM'){muteBtn.click();}
});
addEventListener('keyup',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code))st.bride.hold=false;
  if(['ArrowDown','KeyS'].includes(e.code))st.bride.duck=false;
});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  press(st.state==='run'&&(e.clientY-r.top)/r.height>.62);
});
addEventListener('pointerup',releaseAll);
addEventListener('pointercancel',releaseAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st.state==='run'){/* إيقاف مؤقت بسيط */last=0;}});

/* ============ الجسيمات ============ */
const PCOL=['#ff9ec0','#ffc2d6','#fff','#ff7aa8','#ffd6e5'];
const CCOL=['#ff5c8a','#ffd166','#6ee7b7','#7aa8ff','#fff','#c58bff'];
function burst(x,y,n,type){
  for(let i=0;i<n;i++){
    const p={x,y,vx:0,vy:0,life:1,max:1,type,rot:rnd(0,6.28),vr:rnd(-8,8),size:rnd(3,6),col:'#fff'};
    if(type==='dust'){p.vx=rnd(-70,10);p.vy=rnd(-60,-10);p.max=p.life=rnd(.3,.55);p.col='rgba(255,230,240,.8)';p.size=rnd(2,4);}
    else if(type==='confetti'){p.x=x+rnd(-20,20);p.vx=rnd(-260,260);p.vy=rnd(-520,-180);p.max=p.life=rnd(1.2,2.2);p.col=CCOL[i%CCOL.length];p.size=rnd(4,8);}
    else if(type==='star'){const a=rnd(0,6.28),s=rnd(80,260);p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s-60;p.max=p.life=rnd(.4,.8);p.col=['#ffd166','#fff','#ff7aa8'][i%3];p.size=rnd(3,7);}
    else if(type==='heart'){p.x=x+rnd(-30,30);p.vx=rnd(-30,30);p.vy=rnd(-110,-50);p.max=p.life=rnd(1,1.8);p.col=['#ff4d7d','#ff7aa8','#ffb3cb'][i%3];p.size=rnd(.7,1.4);}
    st.parts.push(p);
  }
}
function updParts(dt){
  const a=st.parts;
  for(const p of a){
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    if(p.type==='confetti'){p.vy+=700*dt;p.vx*=.99;}
    else if(p.type==='star'){p.vy+=500*dt;}
    else if(p.type==='petal'){p.vy+=60*dt;p.vx-=st.speed*.3*dt;}
    else if(p.type==='dust'){p.vy+=-20*dt;p.vx-=st.speed*.4*dt;}
  }
  st.parts=a.filter(p=>p.life>0&&p.y<LH+40);
  if(st.parts.length>260)st.parts.splice(0,st.parts.length-260);
}
function drawParts(c){
  for(const p of st.parts){
    const k=clamp(p.life/p.max,0,1);
    c.save();c.translate(p.x,p.y);c.globalAlpha=Math.min(1,k*1.6);
    if(p.type==='petal'){c.rotate(p.rot);ell(c,0,0,p.size,p.size*.55,PCOL[(p.size*13|0)%5]);}
    else if(p.type==='confetti'){c.rotate(p.rot);c.fillStyle=p.col;c.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);}
    else if(p.type==='star'){c.rotate(p.rot);c.fillStyle=p.col;c.fillRect(-p.size/2,-1.2,p.size,2.4);c.fillRect(-1.2,-p.size/2,2.4,p.size);}
    else if(p.type==='heart'){heart(c,0,0,p.size,p.col);}
    else{c.fillStyle=p.col;c.beginPath();c.arc(0,0,p.size*k+1,0,6.28);c.fill();}
    c.restore();
  }
}

/* ============ العقبات ============ */
function dGlass(c,x,y,s){c.fillStyle='rgba(220,240,255,.85)';c.beginPath();c.moveTo(x-6*s,y-14*s);c.lineTo(x+6*s,y-14*s);c.quadraticCurveTo(x+4*s,y-5*s,x+1*s,y-4*s);c.lineTo(x+1*s,y);c.lineTo(x+4*s,y);c.lineTo(x-4*s,y);c.lineTo(x-1*s,y);c.lineTo(x-1*s,y-4*s);c.quadraticCurveTo(x-4*s,y-5*s,x-6*s,y-14*s);c.fill();c.fillStyle='rgba(255,214,102,.8)';c.fillRect(x-5*s,y-13*s,10*s,4*s);}
const DEFS={
  cake:{w:64,h:80,hb:.9,draw(c,o){
    ell(c,0,-1,34,5,'rgba(0,0,0,.18)');
    const t=[[-30,-24,60,'#ffe3ee'],[-22,-48,44,'#ffc9dd'],[-14,-68,28,'#fff1f6']];
    for(const [x,y,w,col] of t){const h=24;rr(c,x,y,w,h-(y===-68?4:0),5);c.fillStyle=col;c.fill();c.strokeStyle='#e7a3bc';c.lineWidth=1.5;c.stroke();
      c.fillStyle='#fff';for(let i=0;i<w;i+=10){c.beginPath();c.arc(x+5+i,y+h-(y===-68?4:0)-1,4,0,3.1416);c.fill();}
      c.fillStyle='#ff6f9c';for(let i=6;i<w;i+=14){c.beginPath();c.arc(x+i,y+9,2.2,0,6.28);c.fill();}}
    line(c,-2,-68,-2,-76,2,'#444');ell(c,-4,-80,3,3,'#222');ell(c,3,-80,3,3,'#ddd');c.fillStyle='#fff';c.fillRect(2,-79,2,6);
    heart(c,0,-84,.7,'#ff4d7d');
  }},
  table:{w:88,h:56,hb:.9,draw(c,o){
    ell(c,0,-1,46,5,'rgba(0,0,0,.18)');
    rr(c,-8,-28,16,28,3);c.fillStyle='#b98a5a';c.fill();
    c.fillStyle='#fff';c.beginPath();c.moveTo(-42,-34);c.lineTo(42,-34);c.lineTo(48,-6);c.quadraticCurveTo(0,4,-48,-6);c.closePath();c.fill();
    c.strokeStyle='#e7c0cf';c.lineWidth=2;c.stroke();
    c.fillStyle='#ffd1e0';c.beginPath();c.moveTo(-30,-34);c.lineTo(30,-34);c.lineTo(34,-10);c.lineTo(-34,-10);c.fill();
    ell(c,-20,-38,13,4,'#fff');ell(c,20,-38,13,4,'#fff');
    ell(c,-20,-40,8,2.5,'#ffe7a8');ell(c,20,-40,8,2.5,'#ffd0dd');
    rr(c,-4,-52,8,16,2);c.fillStyle='#fff7e0';c.fill();
    const f=Math.sin(o.age*14)*1.2;c.fillStyle='#ffb02e';c.beginPath();c.ellipse(0+f,-56,3,5,0,0,6.28);c.fill();
    heart(c,0,-26,.8,'#ff7aa8');
  }},
  photog:{w:46,h:100,hb:.5,draw(c,o){
    ell(c,0,-1,26,4,'rgba(0,0,0,.18)');
    line(c,0,-70,-22,0,3.5,'#333');line(c,0,-70,22,0,3.5,'#333');line(c,0,-70,0,-2,3.5,'#333');
    rr(c,-22,-96,40,26,5);c.fillStyle='#2d2d34';c.fill();
    rr(c,-22,-96,40,9,4);c.fillStyle='#d9d9e0';c.fill();
    c.beginPath();c.arc(-2,-80,10,0,6.28);c.fillStyle='#16161c';c.fill();c.strokeStyle='#8a8a99';c.lineWidth=2;c.stroke();
    c.beginPath();c.arc(-4,-82,3,0,6.28);c.fillStyle='rgba(120,180,255,.7)';c.fill();
    c.fillStyle='#ff4d4d';c.fillRect(10,-92,4,3);
    if(o.flashFx>0){const k=o.flashFx;c.fillStyle=`rgba(255,255,255,${k})`;c.beginPath();c.arc(-2,-80,26*k+8,0,6.28);c.fill();}
  }},
  tower:{w:48,h:88,hb:.55,draw(c,o){
    ell(c,0,-1,28,4,'rgba(0,0,0,.18)');
    rr(c,-26,-8,52,8,3);c.fillStyle='#e9d9a8';c.fill();
    const rows=[[4,-10],[3,-30],[2,-50],[1,-68]];
    for(const [n,y] of rows){for(let i=0;i<n;i++){dGlass(c,(i-(n-1)/2)*15,y+8,1.1);}}
    c.fillStyle='rgba(255,214,102,.9)';c.fillRect(-5,-76,10,3);
  }},
  chair:{w:36,h:62,hb:.9,draw(c,o){
    ell(c,0,-1,20,4,'rgba(0,0,0,.18)');
    c.strokeStyle='#d4a63c';c.lineCap='round';c.lineWidth=4;
    c.beginPath();c.moveTo(-14,0);c.lineTo(-14,-28);c.moveTo(14,0);c.lineTo(14,-28);c.stroke();
    c.lineWidth=3;c.beginPath();c.moveTo(-14,-28);c.lineTo(-14,-60);c.moveTo(14,-28);c.lineTo(14,-60);c.moveTo(-14,-60);c.lineTo(14,-60);c.moveTo(-14,-46);c.lineTo(14,-46);c.stroke();
    rr(c,-17,-34,34,9,3);c.fillStyle='#fff';c.fill();c.strokeStyle='#d4a63c';c.lineWidth=2;c.stroke();
    c.fillStyle='#ff9ec0';c.fillRect(-14,-60,28,3);
  }},
  gifts:{w:58,h:62,hb:.9,draw(c,o){
    ell(c,0,-1,34,4,'rgba(0,0,0,.18)');
    const box=(x,y,w,h,col,rib)=>{rr(c,x,y,w,h,3);c.fillStyle=col;c.fill();c.fillStyle=rib;c.fillRect(x+w/2-3,y,6,h);c.fillRect(x,y+h/2-3,w,6);};
    box(-28,-30,34,30,'#ff7aa8','#fff4c2');box(4,-24,26,24,'#7aa8ff','#fff');box(-18,-56,24,26,'#c58bff','#ffe9a8');
    ell(c,-6,-60,6,4,'#ffe9a8',-.4);ell(c,2,-60,6,4,'#ffe9a8',.4);
  }},
  drone:{w:60,h:36,hb:.7,fly:62,draw(c,o){
    c.save();c.translate(0,-o.fly-18);
    const sp=o.age*40;
    for(const s of [-1,1]){line(c,s*14,-4,s*26,-12,3,'#444');ell(c,s*26,-14,13*Math.abs(Math.cos(sp)),2.5,'rgba(60,60,70,.7)');}
    rr(c,-18,-8,36,16,6);c.fillStyle='#3c3c48';c.fill();
    rr(c,-18,-8,36,6,4);c.fillStyle='#ff5c8a';c.fill();

const SAYS=['والله لأجيبلك دبلة أكبر!','والله لأعيشك ملكة','أنا غير عن باقي الشباب','أنا لسا حاجز الصالة!','مهر زيادة بس ارجعي!','حماتك بتسلّم عليكي... وبتقول وقّفي!','في منسف، استني نتعشى أول!','بحرق عمان عشانك','لو بتعرفي شو اتحمّلت عشانك','وعد اتغير عشانك'];
const HITSAY=['هههه تستاهلي','هيك بتحبّي الدراما؟'];
const TRIPSAY=['آي! ركبتي','مين حاط الدلّة هون؟!'];
const DANGERSAY=['خلص يا بنت الحلال، استسلمي!','ردّي علي مش قادر اتنفس'];
const CAUGHTSAY=['ما في مهرب... إلا للقاعة!'];
function groomSay(t,d){const g=st.groom;g.say=t;g.sayT=d||2.2;g.nextSay=Math.max(g.nextSay,(d||2.2)+2.5);}
/* خلطة بدون تكرار: كل الجمل تُستخدم مرة قبل إعادة الخلط */
function bag(a){let q=[],last=null;return()=>{if(!q.length){q=a.slice();for(let i=q.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[q[i],q[j]]=[q[j],q[i]];}if(q.length>1&&q[q.length-1]===last){[q[0],q[q.length-1]]=[q[q.length-1],q[0]];}}last=q.pop();return last;};}
const nextSay=bag(SAYS),nextHit=bag(HITSAY),nextTrip=bag(TRIPSAY),nextDanger=bag(DANGERSAY),nextCaught=bag(CAUGHTSAY);
function update(dt){
  st.t+=dt;
  const run=st.state==='run';
  const b=st.bride,gm=st.groom;
  const spd=st.state==='ready'?170:(st.state==='over'?0:st.speed);
  if(run){
    st.speed=Math.min(780,st.speed+7*dt);
    st.dist+=spd*dt;
    const rec=Math.max(3,12-score()/220);
    st.gap=Math.min(300,st.gap+rec*dt);
    /* العروس */
    const gr=b.hold&&b.vy<0?GRAV*.55:(b.duck&&b.air?GRAV*3:GRAV);
    const was=b.air;
    b.vy+=gr*dt;b.y+=b.vy*dt;
    if(b.y>=GY){b.y=GY;b.vy=0;b.air=false;if(was){sfx.land();burst(BX,GY,7,'dust');}}
    b.ph+=dt*(9+spd/90);
    if(b.stun>0)b.stun-=dt;if(b.inv>0)b.inv-=dt;
    /* العقبات */
    if(st.dist>=st.nextAt)spawn();
    const hb={l:BX-17,r:BX+17,t:b.y-(b.duck&&!b.air?52:100),b:b.y};
    for(const o of st.obs){
      o.age+=dt;o.x-=spd*dt;o.flashFx=Math.max(0,o.flashFx-dt*5);
      if(o.kind==='photog'&&!o.flashed&&o.x<BX+330){o.flashed=true;o.flashFx=1;st.flash=.22;sfx.flash();}
      if(!o.hit&&b.inv<=0){
        const r=hitbox(o);
        if(hb.l<r.r&&hb.r>r.l&&hb.t<r.b&&hb.b>r.t){
          o.hit=true;b.inv=1.1;b.stun=.6;st.shake=.3;st.gap-=72;sfx.hit();burst(BX,b.y-50,10,'star');
          groomSay(nextHit(),2);
          if(st.gap<=58){caught();}
        }
      }
    }
    st.obs=st.obs.filter(o=>o.x>-120);
    /* العريس */
    const gx=BX-st.gap;
    const gw=gm;
    gw.ph+=dt*(9+spd/85);
    const g_gr=GRAV;gw.vy+=g_gr*dt;gw.y+=gw.vy*dt;
    if(gw.y>=GY){gw.y=GY;gw.vy=0;gw.air=false;}
    if(gw.stun>0)gw.stun-=dt;
    for(const o of st.obs){
      if(o.gDone)continue;
      const dx=o.x-gx, d=DEFS[o.kind];
      if(o.kind==='drone'){ if(dx<0)o.gDone=true; continue; }
      if(dx<d.w/2+78&&dx>d.w/2-20&&!gw.air&&gw.stun<=0){
        if(o.groomPlan==='trip'&&dx<d.w/2+30){o.gDone=true;gw.stun=.7;st.gap=Math.min(300,st.gap+55);sfx.trip();burst(gx,GY-30,8,'star');groomSay(nextTrip(),2);}
        else if(o.groomPlan==='jump'){o.gDone=true;gw.vy=-850;gw.air=true;}
      }
      if(dx<-d.w)o.gDone=true;
    }
    gw.sweat=st.gap>210;
    gw.dangerT=(gw.dangerT||0)-dt;
    if(st.gap<110&&gw.dangerT<=0&&gw.sayT<=0){groomSay(nextDanger(),2);gw.dangerT=7;}
    gw.sayT-=dt;gw.nextSay-=dt;
    if(gw.nextSay<=0){gw.say=nextSay();gw.sayT=2.1;gw.nextSay=rnd(5,8);}
    /* المراحل */
    const sg=Math.floor(score()/STAGE_LEN);
    if(sg>st.stage){st.stage=sg;st.banner=2.8;st.bannerText='المرحلة '+(sg+1)+': '+STAGES[sg%STAGES.length].name;sfx.mile();burst(BX,60,40,'confetti');st.gap=Math.min(300,st.gap+40);}
    /* بتلات خلف العروس */
    if(Math.random()<dt*14)st.parts.push({x:BX-26,y:b.y-rnd(15,60),vx:-rnd(40,110),vy:rnd(-30,20),life:1.1,max:1.1,type:'petal',rot:rnd(0,6.28),vr:rnd(-6,6),size:rnd(3,5),col:'#fff'});
  }else if(st.state==='ready'){
    st.dist+=spd*dt;b.ph+=dt*8;gm.ph+=dt*8;
    for(const o of st.obs)o.x-=spd*dt;
  }else if(st.state==='over'){
    st.overT+=dt;st.groom.sayT-=dt;
    st.gap=lerp(st.gap,34,Math.min(1,dt*6));
    if(Math.random()<dt*8)burst(BX-10,b.y-110,1,'heart');
  }
  if(st.msgT>0)st.msgT-=dt;
  if(st.banner>0)st.banner-=dt;
  if(st.shake>0)st.shake-=dt;
  if(st.flash>0)st.flash-=dt;
  updParts(dt);
}

}

  if(st.shake>0)c.translate((Math.random()-.5)*10*st.shake*3,(Math.random()-.5)*8*st.shake*3);
  bgDraw(c,st.t);
  groundDraw(c);
  drawObs(c);
  const gm=st.groom,b=st.bride;
  const gx=BX-st.gap;
  const moving=st.state!=='over';
  drawGroom(c,gx,gm.y,{ph:gm.ph,air:gm.air,stun:gm.stun,sweat:gm.sweat,t:st.t});
  drawBride(c,BX,b.y,{ph:b.ph,air:b.air,duck:b.duck&&!b.air,stun:b.stun,inv:b.inv,t:st.t,moving,fear:st.gap<130});
  if(gm.sayT>0&&st.state!=='ready')bubble(c,gx+10,GY-140,gm.say);
  drawParts(c);
  c.restore();
  if(st.flash>0){c.fillStyle=`rgba(255,255,255,${st.flash*1.4})`;c.fillRect(0,0,LW,LH);}
  hud(c);overlay(c);
}
/* ============ مشاركة النتيجة (صورة ستوري 1080x1920) ============ */
const SITE_NAME='Memoria · ميموريا';
const SITE_URL='https://memoria-jo.lovable.app/';
const shareBtn=document.getElementById('share');
function makeShareImage(){
  const W2=1080,H2=1920,c=document.createElement('canvas');c.width=W2;c.height=H2;
  const x=c.getContext('2d');x.direction='rtl';x.textAlign='center';
  const g=x.createLinearGradient(0,0,0,H2);g.addColorStop(0,'#ffb3cf');g.addColorStop(.55,'#c0589b');g.addColorStop(1,'#3a1747');
  x.fillStyle=g;x.fillRect(0,0,W2,H2);
  for(let i=0;i<26;i++)heart(x,(i*211)%W2,(i*397)%H2,2+(i%4),'rgba(255,255,255,.18)');
  x.fillStyle='#fff';x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=18;
  x.font='bold 84px "Segoe UI",Tahoma,Arial';x.fillText('اهربي أيتها العروس!',W2/2,230);
  x.font='bold 300px "Segoe UI",Tahoma,Arial';x.fillText(String(score()),W2/2,560);
  x.font='bold 80px "Segoe UI",Tahoma,Arial';x.fillText('متر',W2/2,670);
  if(st.newBest){x.fillStyle='#ffe08a';x.font='bold 64px "Segoe UI",Tahoma,Arial';x.fillText('رقم قياسي جديد!',W2/2,770);}
  x.shadowBlur=0;
  /* شريط الأرض + الشخصيات بحجم كبير */
  x.fillStyle='rgba(255,255,255,.2)';rr(x,60,860,W2-120,640,40);x.fill();
  x.save();x.translate(540,1380);x.scale(3.4,3.4);
  drawGroom(x,-52,0,{ph:1.2,air:false,stun:0,sweat:true,t:2});
  drawBride(x,40,0,{ph:.4,air:false,duck:false,stun:0,inv:0,t:2,moving:true,fear:true});
  x.restore();
  x.fillStyle='#fff';x.font='bold 66px "Segoe UI",Tahoma,Arial';x.fillText('هل تقدرين تكسرين رقمي؟',W2/2,1620);
  x.font='bold 54px "Segoe UI",Tahoma,Arial';x.fillStyle='#ffe0ec';x.fillText(SITE_NAME,W2/2,1740);
  x.font='40px "Segoe UI",Tahoma,Arial';x.fillText(SITE_URL.replace(/^https?:\/\//,''),W2/2,1805);
  return c;
}
async function shareScore(){
  const c=makeShareImage();
  const text='ركضت '+score()+' متر هربانة من العريس! جرّبي تكسري رقمي: '+SITE_URL;
  c.toBlob(async blob=>{
    if(!blob)return;
    const file=new File([blob],'bride-run.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],text,title:SITE_NAME});return;}catch(e){if(e&&e.name==='AbortError')return;}
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bride-run.png';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },'image/png');
}
shareBtn.addEventListener('click',e=>{e.stopPropagation();shareScore();});
let shareShown=false;
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  update(dt);draw();
  const want=st.state==='over'&&st.overT>.8;
  if(want!==shareShown){shareShown=want;shareBtn.hidden=!want;}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__game={get st(){return st},press,caught,shareImg:()=>makeShareImage().toDataURL("image/png")};
})();
</script>
