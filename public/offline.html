<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0c0c" />
    <title>بلا اتصال — Memoria</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { min-height:100dvh; display:grid; place-items:center; background:#0c0c0c; color:#f5f5f0; font-family:system-ui,sans-serif; padding:1.5rem; text-align:center; }
      .logo { width:72px;height:72px;border-radius:18px;margin:0 auto 1.5rem;display:grid;place-items:center;background:linear-gradient(135deg,#c9a84c,#a07830);font-size:2rem;font-weight:700;color:#0c0c0c; }
      .brand { font-size:1.5rem;font-weight:700;color:#c9a84c;margin-bottom:.5rem; }
      .status-dot { width:10px;height:10px;border-radius:50%;background:#c9a84c;display:inline-block;margin-right:.4rem;animation:pulse 1.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }
      h1 { font-size:1.4rem;font-weight:600;margin-bottom:.75rem; }
      p { color:#b0b0a8;line-height:1.7;margin-bottom:1.75rem;font-size:.9rem; }
      button { background:#f5f5f0;color:#0c0c0c;border:0;border-radius:8px;padding:.75rem 1.75rem;font-size:.95rem;font-weight:600;cursor:pointer;transition:opacity .2s,transform .15s; }
      button:active { transform:scale(.97); }
    </style>
  </head>
  <body>
    <div>
      <div class="logo">E</div>
      <div class="brand">Memoria</div>
      <p style="color:#b0b0a8;font-size:.8rem;margin-bottom:1.5rem"><span class="status-dot"></span>في انتظار الشبكة</p>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>ستُحمَّل الصفحة فور عودة الاتصال — أو اضغطي على إعادة المحاولة.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
    <script>window.addEventListener("online",function(){location.reload();});</script>
  </body>
</html>
