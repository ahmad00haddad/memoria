<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0c0c" />
    <title>بلا اتصال — EliteCapture</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        background: #0c0c0c;
        color: #f5f5f0;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 420px; }
      .logo {
        width: 64px; height: 64px; border-radius: 14px;
        margin: 0 auto 20px; display: grid; place-items: center;
        background: linear-gradient(135deg, #d4af37, #b8860b); color: #0c0c0c;
        font-size: 28px; font-weight: 700;
      }
      h1 { font-size: 22px; margin: 0 0 10px; }
      p { color: #b8b8b0; line-height: 1.8; margin: 0 0 22px; font-size: 15px; }
      button {
        background: #f5f5f0; color: #0c0c0c; border: 0; border-radius: 8px;
        padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
      }
      button:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">E</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        يبدو أنكِ غير متصلة بالشبكة حالياً. تحقّقي من اتصالك ثم أعيدي المحاولة —
        ستعود EliteCapture فور رجوع الإنترنت.
      </p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
